<section id="home" class="m2-Surgical-landing workshops">
  <div class="container">
    <div class="landing-content">
      <div class=" ">
        <h1>Workshops</h1>
      </div>
    </div>
  </div>
</section>

<!-- Dynamic Workshop Sections -->
<ng-container *ngFor="let workshop of paginatedWorkshops; let i = index; let odd = odd">
  <section id="m2-accessories" [class.bg-blue]="odd">
    <div class="container">
      <div class="row d-flex align-items-center">
        <!-- Even index: Carousel left, Text right -->
        <ng-container *ngIf="!odd">
          <div class="col-md-6 owl">
            <owl-carousel-o [options]="customOptions">
              <ng-template carouselSlide *ngFor="let image of workshop.images">
                <img [src]="image" />
              </ng-template>
            </owl-carousel-o>
          </div>
          <div class="col-md-6">
            <div class="about-info">
              <h2 class="wow fadeInUp" style="padding: 0;margin: 0;font-size: 2.5em;">{{ workshop.title }}</h2>
              <div class="wow fadeInUp">
                <p *ngFor="let paragraph of workshop.description.split('\n\n')">{{ paragraph }}</p>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- Odd index: Text left, Carousel right -->
        <ng-container *ngIf="odd">
          <div class="col-md-6">
            <div class="about-info">
              <h2 class="wow fadeInUp" style="padding: 0;margin: 0;font-size: 2.5em;">{{ workshop.title }}</h2>
              <div class="wow fadeInUp">
                <p *ngFor="let paragraph of workshop.description.split('\n\n')">{{ paragraph }}</p>
              </div>
            </div>
          </div>
          <div class="col-md-6 owl">
            <owl-carousel-o [options]="customOptions">
              <ng-template carouselSlide *ngFor="let image of workshop.images">
                <img [src]="image" />
              </ng-template>
            </owl-carousel-o>
          </div>
        </ng-container>
      </div>
    </div>
  </section>
</ng-container>

<!-- Pagination -->
<section class="pagination-section" *ngIf="totalPages > 1">
  <div class="container">
    <div class="pagination-wrapper">
      <button class="pagination-btn prev-btn" (click)="prevPage()" [disabled]="currentPage === 1">
        <span>&laquo;</span> Previous
      </button>

      <div class="page-numbers">
        <button *ngFor="let page of pages"
                class="page-btn"
                [class.active]="page === currentPage"
                (click)="goToPage(page)">
          {{ page }}
        </button>
      </div>

      <button class="pagination-btn next-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">
        Next <span>&raquo;</span>
      </button>
    </div>
    <div class="page-info">
      Page {{ currentPage }} of {{ totalPages }}
    </div>
  </div>
</section>
